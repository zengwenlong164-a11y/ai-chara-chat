function visibleStream(raw){

function contentFromJson(data){return data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content}
function takeDelta(payload,state){
  if(!payload||payload==='[DONE]')return;
  let j;try{j=JSON.parse(payload)}catch(e){return}
  if(j&&j.usage)state.usage=j.usage;
  const choice=j&&j.choices&&j.choices[0];if(!choice)return;
  const delta=choice.delta&&choice.delta.content;
  if(typeof delta==='string'){if(delta)state.saw=true;state.raw+=delta;return}
  const full=choice.message&&choice.message.content;
  if(!state.saw&&typeof full==='string')state.raw=full;

function feedSse(state,chunk,onPreview){
  state.carry+=chunk;let idx;
  while((idx=state.carry.indexOf('\n'))>=0){
    let line=state.carry.slice(0,idx);state.carry=state.carry.slice(idx+1);
    if(line.endsWith('\r'))line=line.slice(0,-1);
    if(!line.startsWith('data:'))continue;
    const payload=line.slice(5).replace(/^ /,'');
    if(payload==='[DONE]'){state.done=true;continue}
    takeDelta(payload,state);
    if(onPreview)onPreview(visibleStream(state.raw));
  }
}

  const dec=new TextDecoder('utf-8'),state={carry:'',raw:'',saw:false,done:false};

    if(step.done)break;
    feedSse(state,dec.decode(step.value||new Uint8Array(),{stream:true}),onPreview);
  }
  feedSse(state,dec.decode(),onPreview);
  if(state.carry.trim()){let line=state.carry.replace(/\r$/,'');if(line.startsWith('data:')){const payload=line.slice(5).replace(/^ /,'');if(payload!=='[DONE]')takeDelta(payload,state);if(onPreview)onPreview(visibleStream(state.raw))}}

  if(!state.raw)throw Error('接口未返回内容');
  return state.raw;
}
function finishLoose(text,onPreview){

  if(t.startsWith('data:')||t.includes('\ndata:')){const state={carry:'',raw:'',saw:false,done:false};feedSse(state,t.endsWith('\n')?t:t+'\n',onPreview);if(state.usage)session.lastUsage=state.usage;if(!state.raw)throw Error('接口未返回内容');return state.raw}

let plazaCat='全部',plazaQ='';
function plaza(){rememberDraft();

const q=plazaQ.trim();
const list=PLAZA.filter(t=>(plazaCat==='全部'||t.cat===plazaCat)&&(!q||(t.name+t.cat+t.background).includes(q)));
$('#app').innerHTML=`<div class="top"><button class="ghost" onclick="home()">‹</button><h1>角色广场</h1></div><div class="form"><input id="pq" placeholder="搜索角色" value="${esc(plazaQ)}" oninput="plazaQ=this.value;plaza()"><div class="bar" style="padding:0">${cats.map(c=>`<button type="button" class="${plazaCat===c?'btn':'ghost'}" onclick="plazaCat='${c}';plaza()">${c}</button>`).join('')}</div><p class="lm">诗词和古典取自公有领域的成年人物；原创角色也都是成年人。这里不提供色情设定。已有的薛宝钗、林黛玉、潘金莲仍在原来的列表里，不会被这里替换。</p>${list.map(t=>`<div class="card"><div class="row"><span class="nm">${t.avatar} ${esc(t.name)}</span><span class="st">${esc(t.cat)}</span></div><div class="lm">${esc(t.background)}</div><button class="btn" onclick="addPlaza('${t.id}')">${D.chars.some(c=>c.id===t.id)?'打开聊天':'添加并开聊'}</button></div>`).join('')}</div>`}
function addPlaza(id){let c=D.chars.find(x=>x.id===id);if(!c){const t=PLAZA.find(x=>x.id===id);if(!t)return;c=blankChar(t);D.chars.push(c);S()}chat(c.id)}
function charToTavern(c){return {spec:'chara_card_v2',spec_version:'2.0',data:{name:c.name||'',description:c.background||'',personality:c.personality||'',scenario:c.scenario||'',first_mes:c.first||'',mes_example:c.examples||'',system_prompt:c.sysExtra||'',post_history_instructions:'',character_book:{entries:(c.lorebook||[]).map(e=>({keys:e.keys||[],secondary_keys:e.keys2||[],content:e.content||'',enabled:e.enabled!==false,constant:!!e.constant}))}}}}
function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xedb88320&-(c&1))}return (c^0xffffffff)>>>0}
function pngChunk(type,data){const tb=new TextEncoder().encode(type),out=new Uint8Array(12+data.length),view=new DataView(out.buffer);view.setUint32(0,data.length);out.set(tb,4);out.set(data,8);view.setUint32(8+data.length,crc32(out.subarray(4,8+data.length)));return out}
const MIN_PNG='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
function encodeCardPng(card){const json=unescape(encodeURIComponent(JSON.stringify(card)));const b64=btoa(json);const key=new TextEncoder().encode('chara'),val=new TextEncoder().encode(b64),data=new Uint8Array(key.length+1+val.length);data.set(key,0);data[key.length]=0;data.set(val,key.length+1);const text=pngChunk('tEXt',data);const base=Uint8Array.from(atob(MIN_PNG),ch=>ch.charCodeAt(0));const view=new DataView(base.buffer,base.byteOffset,base.byteLength);let p=8;while(p+8<=base.length){const n=view.getUint32(p),type=String.fromCharCode(base[p+4],base[p+5],base[p+6],base[p+7]);if(type==='IEND'){const out=new Uint8Array(base.length+text.length);out.set(base.subarray(0,p),0);out.set(text,p);out.set(base.subarray(p),p+text.length);return out}p+=12+n}throw Error('无法生成图片')}
async function shareBlob(blob,filename){const file=typeof File==='function'?new File([blob],filename,{type:blob.type}):null;if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return}catch(e){if(e&&e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('若没有开始下载，请在打开的页面里长按保存')}
function secretList(){const out=[];const one=LS.getItem('acc_key')||'';if(one.length>3)out.push(one);try{const arr=JSON.parse(LS.getItem('acc_keys')||'null');if(Array.isArray(arr))arr.forEach(k=>{if(k&&String(k).length>3)out.push(String(k))})}catch(e){}return out}
function containsSecrets(text){return secretList().some(k=>text.includes(k))}
async function exportCard(kind){if(!cur||cur.members)return;const card=charToTavern(cur);const safe=String(cur.name||'角色').replace(/[^\w\u4e00-\u9fff-]+/g,'_');const body=JSON.stringify(kind==='json'?card:card);if(containsSecrets(body))return alert('导出被取消');if(kind==='json'){await shareBlob(new Blob([JSON.stringify(card,null,2)],{type:'application/json'}),safe+'.json');return}await shareBlob(new Blob([encodeCardPng(card)],{type:'image/png'}),safe+'.png')}

async function importBackup(){const file=$('#bak_file')&&$('#bak_file').files&&$('#bak_file').files[0];if(!file)return alert('请先选择备份文件');if(!confirm('导入会覆盖当前的角色、聊天、群聊和相册。将先自动备份当前数据。继续？'))return;let text;try{text=await file.text()}catch(e){alert('文件读取失败，请重试');return}let obj;try{obj=JSON.parse(text)}catch(e){alert('这不是有效的备份文件');return}const data=obj&&obj.data&&typeof obj.data==='object'?obj.data:obj;if(!data||!Array.isArray(data.chars)||!Array.isArray(data.groups)||!Array.isArray(data.album))return alert('备份里缺少角色、群聊或相册');const current=LS.getItem('acc_data');try{if(current!=null)LS.setItem('acc_data_backup_latest',current)}catch(e){alert('无法先备份当前数据，已取消导入');return}D=data;S();const s=obj.settings||{};try{if(s.base!=null)LS.setItem('acc_base',s.base);if(s.model!=null)LS.setItem('acc_model',s.model);if(s.temp!=null)LS.setItem('acc_temp',s.temp);if(s.freq!=null)LS.setItem('acc_freq',s.freq);if(s.ctx!=null)LS.setItem('acc_ctx',s.ctx);if(s.voice!=null)LS.setItem('acc_voice',s.voice);if(obj.keys){if(obj.keys.acc_key!=null)LS.setItem('acc_key',obj.keys.acc_key);if(obj.keys.acc_keys!=null)LS.setItem('acc_keys',obj.keys.acc_keys)}}catch(e){}alert('已导入');home()}
