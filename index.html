    else if(reason==='busy')toast('服务繁忙，正在切换模型');

  if(!Array.isArray(c.lorebook))return '';
  const text=((ch&&ch.msgs)||[]).slice(-(c.loreDepth||10)).map(m=>m.t||'').join('\n').toLowerCase();
  const hit=keys=>keys.some(k=>{k=String(k).trim().toLowerCase();return k&&text.includes(k)});
  return c.lorebook.filter(e=>e&&e.content&&(e.constant||(hit(Array.isArray(e.keys)?e.keys:[])&&(!Array.isArray(e.keys2)||!e.keys2.length||hit(e.keys2))))).map(e=>e.content).join('\n');
}
function parseReply(s){
  s=String(s);const i=s.indexOf('<<<STATUS>>>');
  if(i>=0){let status=null;try{const m=s.slice(i+12).match(/\{[\s\S]*\}/);const o=m&&JSON.parse(m[0]);if(o&&typeof o==='object'&&!Array.isArray(o))status=o}catch(e){}return {reply:s.slice(0,i).trim()||'……',status}}
  const t=s.trim();if(t.startsWith('{')){
    try{const o=JSON.parse(t.slice(0,t.lastIndexOf('}')+1));if(o&&typeof o==='object'&&Object.prototype.hasOwnProperty.call(o,'reply'))return {reply:String(o.reply||'……'),status:o}}catch(e){}
    if(/^\{[\s\S]*\}$/.test(t))return {reply:'……',status:null};
  }
  return {reply:t||'……',status:null};
}
async function importCard(){
  try{
    const file=$('#f_card').files[0];if(!file)return;
    const png=/\.png$/i.test(file.name)||file.type==='image/png',json=/\.json$/i.test(file.name)||file.type==='application/json';
    if(!png&&!json)return alert('只支持.png 或.json 角色卡');
    const t=tavernToChar(png?parsePngCard(await file.arrayBuffer()):JSON.parse(await file.text()));
    if(!t.name)return alert('这张卡里没有角色名');
    const imported={scenario:t.scenario,examples:t.examples,sysExtra:t.sysExtra,lorebook:t.lorebook,loreDepth:t.loreDepth};
    if(png)imported.avatar=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=()=>reject(Error('图片读取失败'));fr.onload=()=>{const i=new Image();i.onerror=()=>reject(Error('图片解码失败'));i.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(i,0,0,128,128);resolve(c.toDataURL('image/jpeg',.8))}catch(e){reject(e)}};i.src=fr.result};fr.readAsDataURL(file)});
    $('#f_name').value=t.name;$('#f_per').value=t.personality;$('#f_bg').value=t.background;$('#f_first').value=t.first;pendingImport=imported;
    $('#f_imp').textContent=`已导入「${t.name}」：世界书 ${t.lorebook.length} 条`+(t.examples?'・含示例对话':'')+(t.sysExtra?'・含附加指令':'');
  }catch(e){alert('导入失败：'+e.message)}
}
function addLore(){
  document.querySelectorAll('[data-k]').forEach(e=>cur[e.dataset.k]=e.value);
  const keys=$('#l_keys').value.split(/[,，、]/).map(k=>k.trim()).filter(Boolean),content=$('#l_content').value.trim();
  if(!content)return alert('请填写条目内容');if(!keys.length)return alert('请填写至少一个关键词');
  if(!Array.isArray(cur.lorebook))cur.lorebook=[];cur.lorebook.push({keys,content});S();chat(cur.id,'set');
}
function delLore(i){document.querySelectorAll('[data-k]').forEach(e=>cur[e.dataset.k]=e.value);(cur.lorebook||[]).splice(i,1);S();chat(cur.id,'set')}

function pj(s){try{return JSON.parse(s.slice(s.indexOf('{'),s.lastIndexOf('}')+1))}catch(e){return{reply:s}}}
function hist(c,ch){return (ch.msgs||[]).slice(-cfg().ctxN).filter(x=>x.r!='sys').map(x=>({role:x.r=='me'?'user':(x.who&&x.who!=c.name?'user':'assistant'),content:x.r=='me'?'用户：'+x.t:(x.who?x.who+'：':'')+x.t}))}
async function speak(ch,c,extra){pending[ch.id]=c.name;if(isOpen(ch))render();
const msgs=[{role:'system',content:sysP(c,extra,ch)},...hist(c,ch),{role:'user',content:'（请继续）'}];
try{const o=parseReply(await llm(msgs));
ch.msgs.push({r:'ai',t:o.reply,who:ch.members?c.name:'',ts:Date.now()});
if(o.status&&typeof o.status==='object'){const oStatus=o.status;c.status=c.status||{};
Object.assign(c.status,{mood:oStatus.mood||c.status.mood,relation:oStatus.relation||c.status.relation,thoughts:oStatus.thoughts||c.status.thoughts});if(oStatus.affection!=null&&!isNaN(+oStatus.affection))c.status.affection=Math.max(0,Math.min(100,Math.round(+oStatus.affection)))}}
catch(e){ch.msgs.push({r:'sys',t:'⚠️ '+e.message,ts:Date.now()})}
delete pending[ch.id];S()}
async function talk(ch){ch=ch||cur;if(!ch||pending[ch.id])return;if(ch.members){for(const id of ch.members){const c=get(id);if(!c)continue;await speak(ch,c,`这是群聊，成员有：${ch.members.map(m=>(get(m)||{}).name||'已删除').join('、')}和用户。只代表${c.name}发言，可与其他角色互动。`);if(isOpen(ch))render()}}else{await speak(ch,ch);if(isOpen(ch))chat(ch.id)}}
async function gen(k){const ch=cur,key=ch.id+':'+k;if(pending[key])return;pending[key]=1;$('#gout').insertAdjacentHTML('afterbegin','<div class="card" id="ld">生成中…</div>');
try{const r=await llm([{role:'system',content:card(ch)+canonP(ch)+jinlianP(ch)},...hist(ch,ch),{role:'user',content:sidePrompt(ch,k)}]);(ch[k]=ch[k]||[]).unshift(r);S();delete pending[key];if(cur===ch&&tab==k)chat(ch.id,k)}catch(e){delete pending[key];if(cur===ch&&tab==k&&$('#ld'))$('#ld').textContent='⚠️ '+e.message}}
if(storeBroken)toast('本地数据损坏，已重新开始');
home();
</script></body></html>
